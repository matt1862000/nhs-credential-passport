<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00897B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26A69A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4DB6AC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#80CBC4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="20" y="20" width="472" height="472" rx="100" ry="100" fill="url(#bgGradient)"/>
  
  <!-- Clock circle (top right) -->
  <circle cx="340" cy="140" r="70" fill="white" opacity="0.95"/>
  <circle cx="340" cy="140" r="60" fill="none" stroke="#00897B" stroke-width="6"/>
  
  <!-- Clock hands -->
  <line x1="340" y1="140" x2="340" y2="100" stroke="#00897B" stroke-width="6" stroke-linecap="round"/>
  <line x1="340" y1="140" x2="370" y2="140" stroke="#00897B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="340" cy="140" r="6" fill="#00897B"/>
  
  <!-- Walking figure -->
  <!-- Head -->
  <circle cx="180" cy="130" r="40" fill="white"/>
  
  <!-- Body -->
  <path d="M180 170 L180 280" stroke="white" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Arms (walking motion) -->
  <path d="M180 200 L120 260" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <path d="M180 200 L250 240" stroke="white" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Legs (walking motion) -->
  <path d="M180 280 L130 400" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <path d="M180 280 L240 400" stroke="white" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Motion lines -->
  <path d="M300 300 Q350 320 300 340" stroke="white" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M320 280 Q370 300 320 320" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M340 260 Q390 280 340 300" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.3"/>
  
  <!-- Heart/wellbeing accent -->
  <path d="M380 380 C380 360 400 350 420 370 C440 350 460 360 460 380 C460 410 420 440 420 440 C420 440 380 410 380 380Z" fill="url(#accentGradient)" opacity="0.9"/>
</svg>

