<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="DocPass">
  <meta name="theme-color" content="#005eb8">

  <title>Messages &mdash; DocPass</title>
  <link rel="stylesheet" href="/static/shared/app.css?v=20260521-2">
  <style>
    .msg-wrap { max-width: 52rem; }
    /* Thread layout */
    .msg-layout { display: flex; gap: 1rem; align-items: flex-start; }
    .msg-sidebar { width: 16rem; flex-shrink: 0; }
    .msg-thread { flex: 1; min-width: 0; }
    @media (max-width: 640px) {
      .msg-layout { flex-direction: column; }
      .msg-sidebar { width: 100%; }
    }
    /* Conversation list */
    .msg-conv-list { background: #fff; border: 1px solid var(--nhsuk-border); border-radius: 6px; overflow: hidden; }
    .msg-conv-item { display: block; padding: 0.75rem 1rem; border-bottom: 1px solid var(--nhsuk-border); cursor: pointer; text-decoration: none; color: var(--nhsuk-text); }
    .msg-conv-item:last-child { border-bottom: none; }
    .msg-conv-item:hover, .msg-conv-item.active { background: #e8f0fe; }
    .msg-conv-trust { font-weight: 700; font-size: 0.9375rem; line-height: 1.3; }
    .msg-conv-preview { font-size: 0.8125rem; color: var(--nhsuk-secondary-text); margin-top: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-unread-dot { display: inline-block; width: 0.55rem; height: 0.55rem; background: var(--nhsuk-link); border-radius: 50%; margin-left: 0.4rem; vertical-align: middle; }
    .msg-new-btn { display: block; width: 100%; text-align: left; padding: 0.75rem 1rem; background: #005eb8; color: #fff; border: none; cursor: pointer; font-size: 0.9375rem; font-weight: 600; border-radius: 6px 6px 0 0; touch-action: manipulation; user-select: none; transition: background-color 0.15s ease, transform 0.08s ease, box-shadow 0.08s ease; }
    .msg-other-btn {
      display: block; width: 100%; text-align: left; padding: 0.65rem 1rem; margin-top: 0;
      background: #fff; color: #005eb8; border: none; border-top: 1px solid var(--nhsuk-border);
      cursor: pointer; font-size: 0.875rem;
      font-weight: 600; border-radius: 0; font-family: inherit;
    }
    .msg-other-btn:hover { background: #e8f4fb; }
    .msg-search-panel {
      padding: 0.75rem 1rem 1rem 1rem;
      border-top: 1px solid var(--nhsuk-border);
      background: #f8fafb;
    }
    .msg-search-panel[hidden] { display: none !important; }
    .msg-search-panel .nhsuk-label { font-size: 0.875rem; margin-bottom: 0.35rem; display: block; }
    .msg-search-panel .nhsuk-input { width: 100%; max-width: none; box-sizing: border-box; font-size: 0.9375rem; }
    .msg-trust-results {
      list-style: none; margin: 0.35rem 0 0 0; padding: 0;
      border: 1px solid var(--nhsuk-border); border-radius: 4px; background: #fff;
      max-height: 11rem; overflow-y: auto;
    }
    .msg-trust-results[hidden] { display: none !important; }
    .msg-trust-results li {
      padding: 0.55rem 0.75rem; cursor: pointer; font-size: 0.875rem; border-bottom: 1px solid var(--nhsuk-border);
    }
    .msg-trust-results li:last-child { border-bottom: none; }
    .msg-trust-results li:hover, .msg-trust-results li[aria-selected="true"] { background: #e8f0fe; }
    .msg-trust-results-primary { display: block; font-weight: 600; line-height: 1.3; }
    .msg-trust-results-meta { display: block; font-size: 0.78rem; color: var(--nhsuk-secondary-text); margin-top: 0.15rem; font-weight: 400; line-height: 1.25; }
    .msg-search-status { min-height: 1.1rem; font-size: 0.8125rem; margin-top: 0.35rem; color: var(--nhsuk-secondary-text); }
    .msg-new-btn:hover { background: #003d78; }
    .msg-new-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2); }
    .msg-new-btn:disabled { opacity: 0.75; cursor: not-allowed; }
    .msg-new-btn.is-loading {
      position: relative;
      pointer-events: none;
      padding-left: 2.25rem;
      opacity: 0.92;
    }
    .msg-new-btn.is-loading::before {
      content: '';
      position: absolute;
      left: 0.65rem;
      top: 50%;
      width: 0.85rem;
      height: 0.85rem;
      margin-top: -0.425rem;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: msg-btn-spin 0.65s linear infinite;
    }
    @keyframes msg-btn-spin {
      to { transform: rotate(360deg); }
    }
    /* Thread */
    .msg-thread-card { background: #fff; border: 1px solid var(--nhsuk-border); border-radius: 6px; display: flex; flex-direction: column; min-height: 24rem; }
    .msg-thread-header { padding: 0.85rem 1rem; border-bottom: 1px solid var(--nhsuk-border); font-weight: 700; font-size: 1rem; }
    .msg-bubbles { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.65rem; min-height: 14rem; max-height: 50vh; }
    .msg-bubble { max-width: 80%; padding: 0.6rem 0.85rem; border-radius: 12px; font-size: 0.9375rem; line-height: 1.45; word-break: break-word; }
    .msg-bubble--mine { align-self: flex-end; background: #005eb8; color: #fff; border-bottom-right-radius: 3px; }
    .msg-bubble--theirs { align-self: flex-start; background: #f0f4f5; color: var(--nhsuk-text); border-bottom-left-radius: 3px; }
    .msg-bubble-meta { font-size: 0.75rem; margin-top: 0.2rem; opacity: 0.7; }
    .msg-compose { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.85rem 1rem; border-top: 1px solid var(--nhsuk-border); align-items: flex-end; }
    .msg-compose-main { flex: 1 1 12rem; min-width: 0; display: flex; flex-direction: column; gap: 0.35rem; }
    .msg-compose textarea { width: 100%; box-sizing: border-box; resize: none; border: 2px solid var(--nhsuk-border); border-radius: 4px; padding: 0.5rem 0.65rem; font-size: 0.9375rem; font-family: inherit; min-height: 2.75rem; max-height: 8rem; }
    .msg-compose textarea:focus { outline: 3px solid #ffbf47; border-color: var(--nhsuk-text); }
    .msg-compose-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .msg-attach-btn { background: none; border: none; padding: 0; font-size: 0.875rem; color: #005eb8; text-decoration: underline; cursor: pointer; font-family: inherit; }
    .msg-attach-btn:hover { color: #003087; }
    .msg-pending-files { list-style: none; margin: 0; padding: 0; font-size: 0.8125rem; color: var(--nhsuk-secondary-text); }
    .msg-pending-item { display: inline-flex; align-items: center; gap: 0.25rem; margin-right: 0.75rem; margin-bottom: 0.15rem; }
    .msg-pending-remove { background: none; border: none; font-size: 1.1rem; line-height: 1; cursor: pointer; color: var(--nhsuk-error); padding: 0 0.15rem; }
    .msg-bubble-attachments { margin-top: 0.35rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .msg-bubble--mine .msg-attach-link { color: #fff; }
    .msg-attach-link { text-decoration: underline; }
    .msg-attach-size { font-size: 0.8125rem; opacity: 0.85; }
    .msg-attach-thumb { max-width: 14rem; max-height: 10rem; border-radius: 6px; display: block; }
    .msg-send-btn { white-space: nowrap; flex-shrink: 0; }
    .msg-empty { color: var(--nhsuk-secondary-text); font-style: italic; font-size: 0.9375rem; text-align: center; padding: 2rem 1rem; }
    .msg-no-conv { padding: 1.25rem; font-size: 0.9375rem; color: var(--nhsuk-secondary-text); text-align: center; }
  </style>
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo nhsuk-header__service-logo--docpass" href="/static/dashboard/" aria-label="Dashboard">
          <img class="docpass-header-logo" src="/static/shared/docpass-logo.png?v=20260519-1" alt="DocPass — professional credential wallet" width="420" height="146">
        </a>
      </div>
      <nav class="nhsuk-topnav" aria-label="Account">
                <div class="nhsuk-topnav__account" id="navAccount">
          <span class="nhsuk-topnav__name" id="navUserName">&nbsp;</span>
          <a href="/static/messages/" class="nhsuk-topnav__messages" id="navMessagesLink" aria-label="Messages">
            <svg class="nhsuk-topnav__envelope" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span class="nhsuk-topnav__msg-badge" id="navMsgBadge" hidden aria-live="polite"></span>
          </a>
        </div>
        <div class="nhsuk-menu">
          <button type="button" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel">Menu</button>
          <div class="nhsuk-menu__panel" id="menuPanel" role="menu" hidden>
            <a href="/static/dashboard/" role="menuitem">Dashboard</a>
            <a href="/static/profile/" role="menuitem">Profile</a>
            <button type="button" id="btnSignOut" role="menuitem">Sign out</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="nhsuk-main msg-wrap" id="maincontent" role="main">
    <h1 class="nhsuk-page-heading">Messages</h1>

    <div id="mainContent" hidden>
      <div class="msg-layout">
        <!-- Sidebar: conversation list -->
        <div class="msg-sidebar">
          <div class="msg-conv-list" id="convList">
            <button type="button" class="msg-new-btn" id="btnNewConv">+ Message my trust HR</button>
            <button type="button" class="msg-other-btn" id="btnToggleTrustSearch" aria-expanded="false" aria-controls="msgTrustSearchPanel">Message another trust&rsquo;s HR&hellip;</button>
            <div class="msg-search-panel" id="msgTrustSearchPanel" hidden>
              <label class="nhsuk-label" for="msgTrustSearchInput">Search by trust or HR contact name</label>
              <input type="text" class="nhsuk-input" id="msgTrustSearchInput" placeholder="e.g. Rotherham HR, Sheffield" autocomplete="off" aria-autocomplete="list" aria-controls="msgTrustSearchResults">
              <p id="msgSearchStatus" class="msg-search-status" role="status" aria-live="polite"></p>
              <ul id="msgTrustSearchResults" class="msg-trust-results" role="listbox" hidden aria-label="Matching trusts"></ul>
            </div>
            <div id="convItems"><p class="msg-no-conv">No conversations yet.</p></div>
          </div>
        </div>
        <!-- Thread panel -->
        <div class="msg-thread" id="threadPanel">
          <div class="msg-thread-card">
            <div class="msg-thread-header" id="threadHeader">Select a conversation</div>
            <div class="msg-bubbles" id="bubbles"><p class="msg-empty">Choose a conversation on the left, or start a new one.</p></div>
            <div class="msg-compose" id="composeArea" hidden>
              <div class="msg-compose-main">
                <textarea id="msgInput" placeholder="Type a message…" rows="2" aria-label="Message"></textarea>
                <div class="msg-compose-toolbar">
                  <input type="file" id="msgFileInput" multiple hidden
                    accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp">
                  <button type="button" class="msg-attach-btn" id="btnAttach">Attach file</button>
                  <ul class="msg-pending-files" id="msgPendingFiles" hidden aria-label="Files to send"></ul>
                </div>
              </div>
              <button type="button" class="nhsuk-button msg-send-btn" id="btnSend">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/shared/auth.js"></script>
  <script src="/static/shared/nav-account.js?v=20260522-1"></script>
  <script src="/static/shared/messages-common.js?v=20260519-1"></script>
  <script>
    (function () {
      function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
      function show(el, on) { if (el) el.hidden = !on; }

      function wireHamburgerMenu() {
        var btn = document.getElementById('btnMenu'), panel = document.getElementById('menuPanel');
        if (!btn || !panel) return;
        function close() { panel.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
        function open()  { panel.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
        btn.addEventListener('click', function (e) { e.preventDefault(); panel.hidden ? open() : close(); });
        document.addEventListener('click', function (e) { if (!panel.hidden && !btn.contains(e.target) && !panel.contains(e.target)) close(); }, true);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
      }

      async function apiJson(url, opts) {
        opts = opts || {};
        opts.credentials = 'include';
        var res = await fetch(url, opts);
        var text = await res.text();
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) {}
        if (!res.ok) { throw new Error((data && data.detail) || text || res.statusText); }
        return data;
      }

      function fmtTime(iso) {
        if (!iso) return '';
        var d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
        return isNaN(d) ? iso.slice(0, 16).replace('T', ' ') :
          d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      }

      var _myId = null;
      var _activeConvId = null;
      var _inboxPollTimer = null;

      function notifyNavMessages() {
        if (window.NHSNavAccount && typeof NHSNavAccount.notifyMessagesChanged === 'function') {
          NHSNavAccount.notifyMessagesChanged();
        }
      }
      var _pollTimer = null;

      var _compose = NHSMessages.bindCompose('msgFileInput', 'btnAttach', 'msgPendingFiles');

      function renderBubbles(messages) {
        NHSMessages.renderBubbles(
          document.getElementById('bubbles'),
          messages,
          _myId,
          'HR'
        );
      }

      async function loadThread(convId) {
        _activeConvId = convId;
        var header = document.getElementById('threadHeader');
        var compose = document.getElementById('composeArea');
        try {
          var data = await apiJson('/api/me/messages/' + encodeURIComponent(String(convId)));
          var conv = (_convs || []).find(function (c) { return c.id === convId; });
          if (header) header.textContent = conv ? (conv.hr_trust || 'HR') : 'Conversation';
          renderBubbles(data.messages || []);
          show(compose, true);
          // Refresh conv list to clear unread badge
          await loadConversations(false);
          notifyNavMessages();
          startPolling(convId);
        } catch (err) {
          if (header) header.textContent = 'Error';
          var b = document.getElementById('bubbles');
          if (b) b.innerHTML = '<p class="msg-empty" style="color:var(--nhsuk-error);">' + esc(err.message) + '</p>';
        }
      }

      function startPolling(convId) {
        if (_pollTimer) clearInterval(_pollTimer);
        _pollTimer = setInterval(async function () {
          if (_activeConvId !== convId) { clearInterval(_pollTimer); return; }
          try {
            var data = await apiJson('/api/me/messages/' + encodeURIComponent(String(convId)));
            renderBubbles(data.messages || []);
          } catch (e) {}
        }, 6000);
      }

      var _convs = [];

      function renderConvList() {
        var container = document.getElementById('convItems');
        if (!container) return;
        if (!_convs.length) {
          container.innerHTML = '<p class="msg-no-conv">No conversations yet.</p>';
          return;
        }
        container.innerHTML = _convs.map(function (c) {
          var active = c.id === _activeConvId ? ' active' : '';
          var unread = c.unread_count > 0 ? '<span class="msg-unread-dot" aria-label="' + c.unread_count + ' unread"></span>' : '';
          var preview = c.last_body ? esc(String(c.last_body).slice(0, 50)) : '<em>No messages yet</em>';
          return (
            '<div class="msg-conv-item' + active + '" data-conv-id="' + c.id + '" tabindex="0" role="button">' +
              '<div class="msg-conv-trust">' + esc(c.hr_trust || 'HR') + unread + '</div>' +
              '<div class="msg-conv-preview">' + preview + '</div>' +
            '</div>'
          );
        }).join('');
      }

      async function loadConversations(selectFirst) {
        try {
          var data = await apiJson('/api/me/messages');
          _convs = data.conversations || [];
          renderConvList();
          if (selectFirst && _convs.length && _activeConvId === null) {
            await loadThread(_convs[0].id);
          }
        } catch (err) { /* silent */ }
      }

      document.getElementById('convItems').addEventListener('click', async function (e) {
        var item = e.target.closest('[data-conv-id]');
        if (!item) return;
        await loadThread(parseInt(item.getAttribute('data-conv-id'), 10));
        renderConvList();
      });
      document.getElementById('convItems').addEventListener('keydown', async function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          var item = e.target.closest('[data-conv-id]');
          if (item) { e.preventDefault(); await loadThread(parseInt(item.getAttribute('data-conv-id'), 10)); }
        }
      });

      document.getElementById('btnNewConv').addEventListener('click', async function () {
        var b = this;
        b.disabled = true;
        b.classList.add('is-loading');
        b.setAttribute('aria-busy', 'true');
        b.textContent = 'Starting…';
        try {
          var conv = await apiJson('/api/me/messages/start', { method: 'POST' });
          // Merge into list if not already there
          if (!_convs.find(function (c) { return c.id === conv.id; })) {
            _convs.unshift(conv);
          }
          renderConvList();
          await loadThread(conv.id);
        } catch (err) {
          alert(err.message || 'Could not start conversation');
        } finally {
          b.disabled = false;
          b.classList.remove('is-loading');
          b.removeAttribute('aria-busy');
          b.textContent = '+ Message my trust HR';
        }
      });

      var _trustSearchTimer = null;
      var _trustSearchOpen = false;
      var _lastTrustSearchTrusts = [];

      function filterOtherTrusts(trusts) {
        var mine = (window.NHSAuth && NHSAuth.user && NHSAuth.user.current_trust || '').trim().toLowerCase();
        if (!mine) return trusts || [];
        return (trusts || []).filter(function (t) {
          return String(t.trust_name || '').trim().toLowerCase() !== mine;
        });
      }

      function setTrustSearchStatus(msg) {
        var el = document.getElementById('msgSearchStatus');
        if (el) el.textContent = msg || '';
      }

      async function runTrustSearch() {
        var inp = document.getElementById('msgTrustSearchInput');
        var listEl = document.getElementById('msgTrustSearchResults');
        var q = inp ? inp.value.trim() : '';
        if (!listEl) return;
        if (!q.length) {
          listEl.hidden = true;
          listEl.innerHTML = '';
          _lastTrustSearchTrusts = [];
          setTrustSearchStatus('Type at least one letter to see suggestions.');
          return;
        }
        setTrustSearchStatus('Searching…');
        try {
          var data = await apiJson('/api/me/messaging-trusts?q=' + encodeURIComponent(q));
          var trusts = filterOtherTrusts(data.trusts || []);
          _lastTrustSearchTrusts = trusts;
          if (!trusts.length) {
            listEl.hidden = true;
            listEl.innerHTML = '';
            setTrustSearchStatus(q.length ? 'No other HR contacts match. Try another word.' : 'No other trusts on this demo.');
            return;
          }
          listEl.innerHTML = trusts.map(function (t, i) {
            var line = esc((t.label || t.trust_name || '').trim());
            return '<li role="option" tabindex="0" data-trust-idx="' + i + '"><span class="msg-trust-results-primary">' + line + '</span></li>';
          }).join('');
          listEl.hidden = false;
          setTrustSearchStatus(trusts.length + ' result' + (trusts.length === 1 ? '' : 's') + ' — click to open chat.');
        } catch (e) {
          listEl.hidden = true;
          setTrustSearchStatus('');
          alert(e.message || 'Could not search trusts');
        }
      }

      document.getElementById('btnToggleTrustSearch').addEventListener('click', function () {
        var panel = document.getElementById('msgTrustSearchPanel');
        var btn = this;
        _trustSearchOpen = !_trustSearchOpen;
        if (panel) panel.hidden = !_trustSearchOpen;
        btn.setAttribute('aria-expanded', _trustSearchOpen ? 'true' : 'false');
        if (_trustSearchOpen) {
          var inp = document.getElementById('msgTrustSearchInput');
          if (inp) inp.focus();
          runTrustSearch();
        } else {
          setTrustSearchStatus('');
          var lr = document.getElementById('msgTrustSearchResults');
          if (lr) { lr.hidden = true; lr.innerHTML = ''; }
        }
      });

      document.getElementById('msgTrustSearchInput').addEventListener('input', function () {
        clearTimeout(_trustSearchTimer);
        _trustSearchTimer = setTimeout(runTrustSearch, 280);
      });

      document.getElementById('msgTrustSearchResults').addEventListener('click', async function (e) {
        var li = e.target.closest('[data-trust-idx]');
        if (!li) return;
        var idx = parseInt(li.getAttribute('data-trust-idx'), 10);
        var row = _lastTrustSearchTrusts[idx];
        if (!row || !row.trust_name) return;
        try {
          setTrustSearchStatus('Opening conversation…');
          var conv = await apiJson('/api/me/messages/start', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hr_trust: row.trust_name }),
          });
          if (!_convs.find(function (c) { return c.id === conv.id; })) {
            _convs.unshift(conv);
          }
          renderConvList();
          await loadThread(conv.id);
          var panel = document.getElementById('msgTrustSearchPanel');
          var btn = document.getElementById('btnToggleTrustSearch');
          _trustSearchOpen = false;
          if (panel) panel.hidden = true;
          if (btn) btn.setAttribute('aria-expanded', 'false');
          setTrustSearchStatus('');
          var lr = document.getElementById('msgTrustSearchResults');
          if (lr) { lr.hidden = true; lr.innerHTML = ''; }
        } catch (err) {
          alert(err.message || 'Could not start conversation');
          setTrustSearchStatus('');
        }
      });

      async function sendMessage() {
        var inp = document.getElementById('msgInput');
        var text = (inp ? inp.value : '').trim();
        var files = _compose.getPending();
        if (!NHSMessages.canSend(text, files) || _activeConvId === null) return;
        var btn = document.getElementById('btnSend');
        if (btn) {
          if (!btn.dataset.defaultLabel) btn.dataset.defaultLabel = btn.textContent;
          btn.disabled = true;
          btn.classList.add('is-loading');
          btn.setAttribute('aria-busy', 'true');
          btn.textContent = 'Sending…';
        }
        try {
          await NHSMessages.sendMessage(
            '/api/me/messages/' + encodeURIComponent(String(_activeConvId)) + '/send',
            text,
            files
          );
          if (inp) inp.value = '';
          _compose.clear();
          var data = await apiJson('/api/me/messages/' + encodeURIComponent(String(_activeConvId)));
          renderBubbles(data.messages || []);
          await loadConversations(false);
          notifyNavMessages();
        } catch (err) {
          alert(err.message || 'Could not send');
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.classList.remove('is-loading');
            btn.removeAttribute('aria-busy');
            if (btn.dataset.defaultLabel) btn.textContent = btn.dataset.defaultLabel;
          }
        }
      }

      document.getElementById('btnSend').addEventListener('click', sendMessage);
      document.getElementById('msgInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });

      (async function boot() {
        await NHSAuth.refresh();
        if (!NHSAuth.requireAuth()) return;
        _myId = NHSAuth.user.id;
        if (window.NHSNavAccount) void NHSNavAccount.refresh();
        wireHamburgerMenu();
        document.getElementById('btnSignOut').addEventListener('click', async function () {
          await NHSAuth.signOut(); window.location.replace('/');
        });
        show(document.getElementById('mainContent'), true);
        var convParam = new URLSearchParams(window.location.search).get('conv');
        await loadConversations(!convParam);
        if (convParam) {
          var cid = parseInt(convParam, 10);
          if (cid) await loadThread(cid);
        }
        startInboxPolling();
        notifyNavMessages();
      })();
    })();
  </script>
</body>
</html>
