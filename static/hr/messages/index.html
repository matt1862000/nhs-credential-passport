<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="DocPass">
  <meta name="theme-color" content="#005eb8">

  <title>HR Messages &mdash; DocPass</title>
  <link rel="stylesheet" href="/static/shared/app.css?v=20260521-2">
  <link rel="stylesheet" href="/static/shared/messages-compose.css?v=20260524-1">
  <style>
    .msg-wrap { max-width: 60rem; }
    .msg-layout { display: flex; gap: 1rem; align-items: flex-start; }
    .msg-sidebar { width: 20rem; flex-shrink: 0; }
    .msg-thread { flex: 1; min-width: 0; }
    @media (max-width: 700px) { .msg-layout { flex-direction: column; } .msg-sidebar { width: 100%; } }
    .msg-conv-list { background: #fff; border: 1px solid var(--nhsuk-border); border-radius: 6px; overflow: hidden; }
    .msg-conv-item { display: block; padding: 0.75rem 1rem; border-bottom: 1px solid var(--nhsuk-border); cursor: pointer; }
    .msg-conv-item:last-child { border-bottom: none; }
    .msg-conv-item:hover, .msg-conv-item.active { background: #e8f0fe; }
    .msg-conv-name { font-weight: 700; font-size: 0.9375rem; }
    .msg-conv-meta { font-size: 0.8125rem; color: var(--nhsuk-secondary-text); margin-top: 0.15rem; }
    .msg-conv-preview { font-size: 0.8125rem; color: var(--nhsuk-secondary-text); margin-top: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-unread-dot { display: inline-block; width: 0.55rem; height: 0.55rem; background: #d4380d; border-radius: 50%; margin-left: 0.4rem; vertical-align: middle; }
    .msg-sidebar-header { padding: 0.75rem 1rem; background: #005eb8; color: #fff; font-weight: 700; font-size: 0.9375rem; border-radius: 6px 6px 0 0; }
    .msg-thread-card { background: #fff; border: 1px solid var(--nhsuk-border); border-radius: 6px; display: flex; flex-direction: column; min-height: 24rem; }
    .msg-thread-header { padding: 0.85rem 1rem; border-bottom: 1px solid var(--nhsuk-border); }
    .msg-thread-header-name { font-weight: 700; font-size: 1rem; }
    .msg-thread-header-meta { font-size: 0.8125rem; color: var(--nhsuk-secondary-text); margin-top: 0.15rem; }
    .msg-bubbles { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.65rem; min-height: 14rem; max-height: 50vh; }
    .msg-bubble { max-width: 80%; padding: 0.6rem 0.85rem; border-radius: 12px; font-size: 0.9375rem; line-height: 1.45; word-break: break-word; }
    .msg-bubble--mine { align-self: flex-end; background: #005eb8; color: #fff; border-bottom-right-radius: 3px; }
    .msg-bubble--theirs { align-self: flex-start; background: #f0f4f5; color: var(--nhsuk-text); border-bottom-left-radius: 3px; }
    .msg-bubble-meta { font-size: 0.75rem; margin-top: 0.2rem; opacity: 0.7; }
    .msg-empty { color: var(--nhsuk-secondary-text); font-style: italic; font-size: 0.9375rem; text-align: center; padding: 2rem 1rem; }
    .msg-no-conv { padding: 1rem; font-size: 0.9375rem; color: var(--nhsuk-secondary-text); text-align: center; }
    .msg-new-btn { display: block; width: 100%; text-align: left; padding: 0.75rem 1rem; background: #005eb8; color: #fff; border: none; cursor: pointer; font-size: 0.9375rem; font-weight: 600; border-radius: 6px 6px 0 0; touch-action: manipulation; font-family: inherit; }
    .msg-new-btn:hover { background: #003d78; }
    .msg-search-panel { padding: 0.75rem 1rem 1rem; border-bottom: 1px solid var(--nhsuk-border); background: #f8fafb; }
    .msg-search-panel[hidden] { display: none !important; }
    .msg-search-panel .nhsuk-label { font-size: 0.875rem; margin-bottom: 0.35rem; display: block; }
    .msg-search-panel .nhsuk-input { width: 100%; max-width: none; box-sizing: border-box; font-size: 0.9375rem; }
    .msg-doctor-results { list-style: none; margin: 0.35rem 0 0; padding: 0; border: 1px solid var(--nhsuk-border); border-radius: 4px; background: #fff; max-height: 11rem; overflow-y: auto; }
    .msg-doctor-results[hidden] { display: none !important; }
    .msg-doctor-results li { padding: 0.55rem 0.75rem; cursor: pointer; font-size: 0.875rem; border-bottom: 1px solid var(--nhsuk-border); }
    .msg-doctor-results li:last-child { border-bottom: none; }
    .msg-doctor-results li:hover { background: #e8f0fe; }
    .msg-doctor-results-primary { display: block; font-weight: 600; line-height: 1.3; }
    .msg-doctor-results-meta { display: block; font-size: 0.78rem; color: var(--nhsuk-secondary-text); margin-top: 0.15rem; }
    .msg-search-status { min-height: 1.1rem; font-size: 0.8125rem; margin-top: 0.35rem; color: var(--nhsuk-secondary-text); }
  </style>
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo nhsuk-header__service-logo--docpass" href="/static/dashboard/" aria-label="Dashboard">
          <img class="docpass-header-logo" src="/static/shared/docpass-logo.png?v=20260519-1" alt="DocPass — professional credential wallet" width="420" height="146">
        </a>
      </div>
      <nav class="nhsuk-topnav" aria-label="Account">
                <div class="nhsuk-topnav__account" id="navAccount">
          <span class="nhsuk-topnav__name" id="navUserName">&nbsp;</span>
          <a href="/static/hr/messages/" class="nhsuk-topnav__messages" id="navMessagesLink" aria-label="Messages">
            <svg class="nhsuk-topnav__envelope" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span class="nhsuk-topnav__msg-badge" id="navMsgBadge" hidden aria-live="polite"></span>
          </a>
        </div>
        <div class="nhsuk-menu">
          <button type="button" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel">Menu</button>
          <div class="nhsuk-menu__panel" id="menuPanel" role="menu" hidden>
            <a href="/static/dashboard/" role="menuitem">Dashboard</a>
            <a href="/static/profile/" role="menuitem">Profile</a>
            <button type="button" id="btnSignOut" role="menuitem">Sign out</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="nhsuk-main msg-wrap" id="maincontent" role="main">
    <h1 class="nhsuk-page-heading">Messages</h1>

    <div id="notPremium" hidden>
      <p style="font-weight:700;">This page is only for HR accounts.</p>
    </div>

    <div id="mainContent" hidden>
      <div class="msg-layout">
        <div class="msg-sidebar">
          <div class="msg-conv-list">
            <div class="msg-search-panel" id="msgDoctorSearchPanel">
              <label class="nhsuk-label" for="msgDoctorSearchInput">Search clinicians (name, email, or GMC)</label>
              <input type="text" class="nhsuk-input" id="msgDoctorSearchInput" placeholder="Find unread or open a past conversation…" autocomplete="off" aria-autocomplete="list" aria-controls="msgDoctorSearchResults">
              <p id="msgSearchStatus" class="msg-search-status" role="status" aria-live="polite">Search to message a clinician or open read history.</p>
              <ul id="msgDoctorSearchResults" class="msg-doctor-results" role="listbox" hidden aria-label="Matching clinicians"></ul>
            </div>
            <div class="msg-sidebar-header">Unread messages</div>
            <div id="convItems"><p class="msg-no-conv">No conversations yet.</p></div>
          </div>
        </div>
        <div class="msg-thread" id="threadPanel">
          <div class="msg-thread-card">
            <div class="msg-thread-header" id="threadHeader">
              <div class="msg-thread-header-name" id="threadName">Select a conversation</div>
              <div class="msg-thread-header-meta" id="threadMeta"></div>
            </div>
            <div class="msg-bubbles" id="bubbles"><p class="msg-empty">Choose a conversation on the left, or message a clinician.</p></div>
            <div class="msg-compose" id="composeArea" hidden>
              <div class="msg-compose-row">
                <input type="file" id="msgFileInput" multiple hidden
                  accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp">
                <button type="button" class="msg-attach-btn" id="btnAttach" aria-label="Attach file" title="Attach file"></button>
                <div class="msg-compose-field">
                  <textarea id="msgInput" placeholder="Type a message…" rows="2" aria-label="Message"></textarea>
                </div>
                <button type="button" class="nhsuk-button msg-send-btn" id="btnSend">Send</button>
              </div>
              <ul class="msg-pending-files" id="msgPendingFiles" hidden aria-label="Files to send"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/shared/auth.js"></script>
  <script src="/static/shared/nav-account.js?v=20260522-1"></script>
  <script src="/static/shared/messages-common.js?v=20260524-1"></script>
  <script>
    (function () {
      function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
      function show(el, on) { if (el) el.hidden = !on; }

      function wireHamburgerMenu() {
        var btn = document.getElementById('btnMenu'), panel = document.getElementById('menuPanel');
        if (!btn || !panel) return;
        function close() { panel.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
        function open()  { panel.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
        btn.addEventListener('click', function (e) { e.preventDefault(); panel.hidden ? open() : close(); });
        document.addEventListener('click', function (e) { if (!panel.hidden && !btn.contains(e.target) && !panel.contains(e.target)) close(); }, true);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
      }

      async function apiJson(url, opts) {
        opts = opts || {};
        opts.credentials = 'include';
        var res = await fetch(url, opts);
        var text = await res.text();
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) {}
        if (!res.ok) { throw new Error((data && data.detail) || text || res.statusText); }
        return data;
      }

      function fmtTime(iso) {
        if (!iso) return '';
        var d = new Date(iso + (iso.endsWith('Z') ? '' : 'Z'));
        return isNaN(d) ? iso.slice(0, 16).replace('T', ' ') :
          d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      }

      var _myId = null;
      var _activeConvId = null;
      var _activeConv = null;
      var _allConvs = [];
      var _convs = [];
      var _pollTimer = null;
      var _inboxPollTimer = null;

      function sidebarConversations() {
        var unread = _allConvs.filter(function (c) { return Number(c.unread_count || 0) > 0; });
        if (_activeConvId === null) return unread;
        var active = _allConvs.find(function (c) { return c.id === _activeConvId; });
        if (!active || unread.some(function (c) { return c.id === active.id; })) return unread;
        return [active].concat(unread);
      }

      function notifyNavMessages() {
        if (window.NHSNavAccount && typeof NHSNavAccount.notifyMessagesChanged === 'function') {
          NHSNavAccount.notifyMessagesChanged();
        }
      }

      var _compose = NHSMessages.bindCompose('msgFileInput', 'btnAttach', 'msgPendingFiles');

      function renderBubbles(messages) {
        NHSMessages.renderBubbles(
          document.getElementById('bubbles'),
          messages,
          _myId,
          'Clinician'
        );
      }

      async function loadThread(convId) {
        _activeConvId = convId;
        _activeConv = _allConvs.find(function (c) { return c.id === convId; }) || null;
        var threadName = document.getElementById('threadName');
        var threadMeta = document.getElementById('threadMeta');
        var compose = document.getElementById('composeArea');
        if (threadName) {
          threadName.textContent = _activeConv ? (_activeConv.doctor_name || _activeConv.doctor_email || 'Clinician') : 'Conversation';
        }
        if (threadMeta && _activeConv) {
          var meta = [];
          if (_activeConv.doctor_email) meta.push(_activeConv.doctor_email);
          if (_activeConv.doctor_gmc) meta.push('GMC ' + _activeConv.doctor_gmc);
          threadMeta.textContent = meta.join(' · ');
        }
        try {
          var data = await apiJson('/api/hr/messages/' + encodeURIComponent(String(convId)));
          renderBubbles(data.messages || []);
          show(compose, true);
          await loadConversations(false);
          startPolling(convId);
        } catch (err) {
          var b = document.getElementById('bubbles');
          if (b) b.innerHTML = '<p class="msg-empty" style="color:var(--nhsuk-error);">' + esc(err.message) + '</p>';
        }
      }

      function startPolling(convId) {
        if (_pollTimer) clearInterval(_pollTimer);
        _pollTimer = setInterval(async function () {
          if (_activeConvId !== convId) { clearInterval(_pollTimer); return; }
          try {
            var data = await apiJson('/api/hr/messages/' + encodeURIComponent(String(convId)));
            renderBubbles(data.messages || []);
          } catch (e) {}
        }, 6000);
      }

      function renderConvList() {
        var container = document.getElementById('convItems');
        if (!container) return;
        _convs = sidebarConversations();
        if (!_convs.length) {
          container.innerHTML = '<p class="msg-no-conv">No unread messages. Search above to find a clinician or open a past conversation.</p>';
          return;
        }
        container.innerHTML = _convs.map(function (c) {
          var active = c.id === _activeConvId ? ' active' : '';
          var unread = c.unread_count > 0 ? '<span class="msg-unread-dot" aria-label="' + c.unread_count + ' unread"></span>' : '';
          var name = c.doctor_name || c.doctor_email || 'Clinician';
          var gmcBit = c.doctor_gmc ? ' · GMC ' + esc(c.doctor_gmc) : '';
          var preview = c.last_body ? esc(String(c.last_body).slice(0, 55)) : '<em>No messages yet</em>';
          return (
            '<div class="msg-conv-item' + active + '" data-conv-id="' + c.id + '" tabindex="0" role="button">' +
              '<div class="msg-conv-name">' + esc(name) + unread + '</div>' +
              '<div class="msg-conv-meta">' + esc(c.doctor_email || '') + gmcBit + '</div>' +
              '<div class="msg-conv-preview">' + preview + '</div>' +
            '</div>'
          );
        }).join('');
      }

      async function loadConversations(selectFirst) {
        try {
          var data = await apiJson('/api/hr/messages');
          _allConvs = data.conversations || [];
          renderConvList();
          if (selectFirst && _convs.length && _activeConvId === null) {
            await loadThread(_convs[0].id);
          }
        } catch (e) {}
      }

      document.getElementById('convItems').addEventListener('click', async function (e) {
        var item = e.target.closest('[data-conv-id]');
        if (!item) return;
        await loadThread(parseInt(item.getAttribute('data-conv-id'), 10));
        renderConvList();
      });
      document.getElementById('convItems').addEventListener('keydown', async function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          var item = e.target.closest('[data-conv-id]');
          if (item) { e.preventDefault(); await loadThread(parseInt(item.getAttribute('data-conv-id'), 10)); }
        }
      });

      async function sendMessage() {
        var inp = document.getElementById('msgInput');
        var text = (inp ? inp.value : '').trim();
        var files = _compose.getPending();
        if (!NHSMessages.canSend(text, files) || _activeConvId === null) return;
        var btn = document.getElementById('btnSend');
        if (btn) {
          if (!btn.dataset.defaultLabel) btn.dataset.defaultLabel = btn.textContent;
          btn.disabled = true;
          btn.classList.add('is-loading');
          btn.setAttribute('aria-busy', 'true');
          btn.textContent = 'Sending…';
        }
        try {
          await NHSMessages.sendMessage(
            '/api/hr/messages/' + encodeURIComponent(String(_activeConvId)) + '/send',
            text,
            files
          );
          if (inp) inp.value = '';
          _compose.clear();
          var data = await apiJson('/api/hr/messages/' + encodeURIComponent(String(_activeConvId)));
          renderBubbles(data.messages || []);
          await loadConversations(false);
          notifyNavMessages();
        } catch (err) {
          alert(err.message || 'Could not send');
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.classList.remove('is-loading');
            btn.removeAttribute('aria-busy');
            if (btn.dataset.defaultLabel) btn.textContent = btn.dataset.defaultLabel;
          }
        }
      }

      document.getElementById('btnSend').addEventListener('click', sendMessage);
      document.getElementById('msgInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });

      var _doctorSearchTimer = null;
      var _lastDoctorSearch = [];

      function setDoctorSearchStatus(msg) {
        var el = document.getElementById('msgSearchStatus');
        if (el) el.textContent = msg || '';
      }

      async function openConversationWithDoctor(doctorId) {
        var conv = await apiJson('/api/hr/messages/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ doctor_user_id: doctorId }),
        });
        if (!_allConvs.find(function (c) { return c.id === conv.id; })) {
          _allConvs.unshift(conv);
        } else {
          _allConvs = _allConvs.map(function (c) { return c.id === conv.id ? conv : c; });
        }
        renderConvList();
        await loadThread(conv.id);
      }

      async function runDoctorSearch() {
        var inp = document.getElementById('msgDoctorSearchInput');
        var listEl = document.getElementById('msgDoctorSearchResults');
        var q = inp ? inp.value.trim() : '';
        if (!listEl) return;
        if (!q.length) {
          listEl.hidden = true;
          listEl.innerHTML = '';
          _lastDoctorSearch = [];
          setDoctorSearchStatus('Search to message a clinician or open read history.');
          return;
        }
        setDoctorSearchStatus('Searching…');
        try {
          var data = await apiJson('/api/hr/messages/doctors/search?q=' + encodeURIComponent(q));
          var results = data.results || [];
          _lastDoctorSearch = results;
          if (!results.length) {
            listEl.hidden = true;
            listEl.innerHTML = '';
            setDoctorSearchStatus('No matching clinicians found.');
            return;
          }
          listEl.innerHTML = results.map(function (doc, i) {
            var name = esc((doc.display_name || doc.email || 'Clinician').trim());
            var meta = [];
            if (doc.gmc_number) meta.push('GMC ' + esc(doc.gmc_number));
            if (doc.email) meta.push(esc(doc.email));
            if (doc.current_trust) meta.push(esc(doc.current_trust));
            return (
              '<li role="option" tabindex="0" data-doctor-idx="' + i + '">' +
                '<span class="msg-doctor-results-primary">' + name + '</span>' +
                (meta.length ? '<span class="msg-doctor-results-meta">' + meta.join(' · ') + '</span>' : '') +
              '</li>'
            );
          }).join('');
          listEl.hidden = false;
          setDoctorSearchStatus(results.length + ' result' + (results.length === 1 ? '' : 's') + ' — click to open chat.');
        } catch (e) {
          listEl.hidden = true;
          setDoctorSearchStatus(e.message || 'Search failed.');
        }
      }

      document.getElementById('msgDoctorSearchInput').addEventListener('input', function () {
        clearTimeout(_doctorSearchTimer);
        _doctorSearchTimer = setTimeout(runDoctorSearch, 280);
      });

      document.getElementById('msgDoctorSearchResults').addEventListener('click', async function (e) {
        var li = e.target.closest('[data-doctor-idx]');
        if (!li) return;
        var idx = parseInt(li.getAttribute('data-doctor-idx'), 10);
        var doc = _lastDoctorSearch[idx];
        if (!doc || !doc.id) return;
        try {
          setDoctorSearchStatus('Opening conversation…');
          await openConversationWithDoctor(doc.id);
          var inp = document.getElementById('msgDoctorSearchInput');
          if (inp) inp.value = '';
          setDoctorSearchStatus('Search to message a clinician or open read history.');
          var lr = document.getElementById('msgDoctorSearchResults');
          if (lr) { lr.hidden = true; lr.innerHTML = ''; }
        } catch (err) {
          alert(err.message || 'Could not start conversation');
          setDoctorSearchStatus('');
        }
      });

      (async function boot() {
        await NHSAuth.refresh();
        if (!NHSAuth.requireAuth()) return;
        _myId = NHSAuth.user.id;
        if (window.NHSNavAccount) void NHSNavAccount.refresh();
        wireHamburgerMenu();
        document.getElementById('btnSignOut').addEventListener('click', async function () {
          await NHSAuth.signOut(); window.location.replace('/');
        });
        if (!NHSAuth.user.premium) {
          show(document.getElementById('notPremium'), true);
          return;
        }
        show(document.getElementById('mainContent'), true);
        await loadConversations(false);
        var params = new URLSearchParams(window.location.search);
        var doctorParam = params.get('doctor');
        var convParam = params.get('conv');
        if (convParam) {
          var cid = parseInt(convParam, 10);
          if (cid) await loadThread(cid);
        } else if (doctorParam) {
          try {
            await openConversationWithDoctor(parseInt(doctorParam, 10));
            try { window.history.replaceState({}, '', '/static/hr/messages/'); } catch (eHist) {}
          } catch (err) {
            alert(err.message || 'Could not open conversation');
          }
        } else if (_convs.length) {
          await loadThread(_convs[0].id);
        }
        if (_inboxPollTimer) clearInterval(_inboxPollTimer);
        _inboxPollTimer = setInterval(function () { loadConversations(false); }, 15000);
        notifyNavMessages();
      })();
    })();
  </script>
</body>
</html>
