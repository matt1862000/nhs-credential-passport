<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search doctors and groups &mdash; DocPass</title>
  <script>
    (function () {
      var u = new URL('/static/hr/cohorts/', window.location.origin);
      var incoming = new URLSearchParams(window.location.search);
      incoming.forEach(function (v, k) { u.searchParams.set(k, v); });
      u.searchParams.set('search', '1');
      window.location.replace(u.pathname + '?' + u.searchParams.toString() + window.location.hash);
    })();
  </script>
</head>
<body>
  <p><a href="/static/hr/cohorts/?search=1">Continue to Search doctors and groups</a></p>
</body>
</html>
