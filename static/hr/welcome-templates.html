<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome templates &mdash; DocPass</title>
  <link rel="stylesheet" href="/static/shared/app.css?v=20260521-2">
  <link rel="stylesheet" href="/static/hr/hr-common.css?v=20260527-1">
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo nhsuk-header__service-logo--docpass" href="/static/dashboard/" aria-label="Dashboard">
          <img class="docpass-header-logo" src="/static/shared/docpass-logo.png?v=20260519-1" alt="DocPass" width="420" height="146">
        </a>
      </div>
      <nav class="nhsuk-topnav" aria-label="Account">
        <div class="nhsuk-topnav__account" id="navAccount"><span class="nhsuk-topnav__name" id="navUserName">&nbsp;</span></div>
        <div class="nhsuk-menu">
          <button type="button" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel">Menu</button>
          <div class="nhsuk-menu__panel" id="menuPanel" role="menu" hidden>
            <a href="/static/dashboard/" role="menuitem">Dashboard</a>
            <button type="button" id="btnSignOut" role="menuitem">Sign out</button>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <main class="nhsuk-main hr-wrap" role="main">
    <h1 class="nhsuk-page-heading">Welcome message templates</h1>
    <p class="nhsuk-lead">Reusable welcome text for cohorts. Use <strong>{name}</strong> and <strong>{trust}</strong>. Link templates to mandatory topics for gap-based suggestions on cohort pages.</p>
    <div class="hr-actions" style="margin-bottom:1rem;">
      <a href="/static/hr/cohorts/" class="nhsuk-button nhsuk-button--secondary">Cohorts</a>
      <a href="/static/dashboard/" class="nhsuk-button nhsuk-button--secondary">Dashboard</a>
    </div>
    <div class="hr-card">
      <h2 style="margin-top:0;font-size:1.125rem;">New template</h2>
      <div class="nhsuk-form-group">
        <label class="nhsuk-label" for="wtName">Name</label>
        <input class="nhsuk-input" type="text" id="wtName" maxlength="120" placeholder="e.g. Fire Safety gap reminder">
      </div>
      <div class="nhsuk-form-group">
        <label class="nhsuk-label" for="wtTopicId">Mandatory topic ID (optional)</label>
        <span class="nhsuk-hint">For auto-suggest when a cohort has gaps on that topic.</span>
        <input class="nhsuk-input" type="number" id="wtTopicId" min="1" placeholder="Topic ID from Mandatory requirements">
      </div>
      <div class="nhsuk-form-group">
        <label class="nhsuk-label" for="wtBody">Message</label>
        <textarea class="nhsuk-textarea" id="wtBody" rows="5" maxlength="4000" placeholder="Hi {name}, welcome to {trust}. Please complete Fire Safety and share evidence with HR."></textarea>
      </div>
      <button type="button" class="nhsuk-button" id="btnSaveTemplate">Save template</button>
      <input type="hidden" id="wtEditId" value="">
      <p id="wtStatus" class="hr-muted" aria-live="polite"></p>
    </div>
    <div class="hr-card" style="margin-top:1.25rem;">
      <h2 style="margin-top:0;font-size:1.125rem;">Library</h2>
      <div class="hr-table-wrap">
        <table class="hr-table">
          <thead><tr><th>Name</th><th>Topic</th><th></th></tr></thead>
          <tbody id="wtTbody"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="/static/shared/auth.js?v=20260523-1"></script>
  <script src="/static/shared/nav-account.js?v=20260527-1"></script>
  <script>
    (function () {
      function esc(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
      }
      async function apiJson(url, opts) {
        var r = await fetch(url, Object.assign({ credentials: 'include' }, opts || {}));
        var t = await r.text();
        var data = null;
        try { data = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) throw new Error((data && data.detail) || t || r.statusText);
        return data;
      }
      async function loadList() {
        var data = await apiJson('/api/hr/welcome-templates');
        var rows = data.templates || [];
        var tb = document.getElementById('wtTbody');
        if (!rows.length) {
          tb.innerHTML = '<tr><td colspan="3" class="hr-muted">No templates yet.</td></tr>';
          return;
        }
        tb.innerHTML = rows.map(function (t) {
          return '<tr><td>' + esc(t.name) + '</td><td>' + esc(t.topic_name || (t.topic_id ? '#' + t.topic_id : '—')) + '</td><td>'
            + '<button type="button" class="nhsuk-button nhsuk-button--secondary hr-btn-small" data-edit="' + t.id + '">Edit</button> '
            + '<button type="button" class="nhsuk-button nhsuk-button--secondary hr-btn-small" data-del="' + t.id + '">Delete</button></td></tr>';
        }).join('');
      }
      document.getElementById('btnSaveTemplate').addEventListener('click', async function () {
        var st = document.getElementById('wtStatus');
        try {
          var body = {
            name: document.getElementById('wtName').value,
            body: document.getElementById('wtBody').value,
            topic_id: document.getElementById('wtTopicId').value || null,
          };
          var eid = document.getElementById('wtEditId').value;
          if (eid) body.id = Number(eid);
          await apiJson('/api/hr/welcome-templates', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          st.textContent = 'Saved.';
          document.getElementById('wtEditId').value = '';
          document.getElementById('wtName').value = '';
          document.getElementById('wtBody').value = '';
          document.getElementById('wtTopicId').value = '';
          await loadList();
        } catch (e) {
          st.textContent = e.message || 'Error';
        }
      });
      document.getElementById('wtTbody').addEventListener('click', async function (e) {
        var edit = e.target.closest('[data-edit]');
        var del = e.target.closest('[data-del]');
        if (edit) {
          var id = Number(edit.getAttribute('data-edit'));
          var data = await apiJson('/api/hr/welcome-templates');
          var t = (data.templates || []).find(function (x) { return x.id === id; });
          if (t) {
            document.getElementById('wtEditId').value = String(t.id);
            document.getElementById('wtName').value = t.name || '';
            document.getElementById('wtBody').value = t.body || '';
            document.getElementById('wtTopicId').value = t.topic_id || '';
          }
          return;
        }
        if (del) {
          if (!confirm('Delete this template?')) return;
          await apiJson('/api/hr/welcome-templates/' + del.getAttribute('data-del'), { method: 'DELETE' });
          await loadList();
        }
      });
      (async function () {
        await NHSAuth.refresh();
        if (!NHSAuth.user || !NHSAuth.user.premium) {
          window.location.replace('/static/dashboard/');
          return;
        }
        if (window.NHSNavAccount) void NHSNavAccount.refresh();
        await loadList();
      })();
    })();
  </script>
</body>
</html>
