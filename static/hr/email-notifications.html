<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email notifications &mdash; DocPass</title>
  <link rel="stylesheet" href="/static/shared/app.css?v=20260523-2">
  <link rel="stylesheet" href="/static/hr/hr-common.css?v=20260527-1">
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo nhsuk-header__service-logo--docpass" href="/static/dashboard/" aria-label="Dashboard">
          <img class="docpass-header-logo" src="/static/shared/docpass-logo.png?v=20260519-1" alt="DocPass" width="420" height="146">
        </a>
      </div>
      <nav class="nhsuk-topnav" aria-label="Account">
        <div class="nhsuk-topnav__account" id="navAccount"><span class="nhsuk-topnav__name" id="navUserName">&nbsp;</span></div>
        <div class="nhsuk-menu">
          <button type="button" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel">Menu</button>
          <div class="nhsuk-menu__panel" id="menuPanel" role="menu" hidden>
            <a href="/static/dashboard/" role="menuitem">Dashboard</a>
            <button type="button" id="btnSignOut" role="menuitem">Sign out</button>
          </div>
        </div>
      </nav>
    </div>
  </header>
  <main class="nhsuk-main hr-wrap" role="main">
    <h1 class="nhsuk-page-heading">Email notifications</h1>
    <p class="nhsuk-lead">Get verification inbox and message alerts by email so you do not have to check DocPass every day.</p>

    <div id="notPremium" class="hr-card" hidden>
      <p style="margin:0;font-weight:700;">This page is only for HR accounts.</p>
    </div>

    <div id="prefsView" class="hr-card" hidden>
      <p class="hr-muted" style="margin-top:0;">Emails are sent to <strong id="prefEmail">—</strong></p>
      <p id="inboxSnapshot" class="hr-muted" aria-live="polite"></p>

      <div class="nhsuk-form-group">
        <div class="nhsuk-checkboxes__item">
          <input class="nhsuk-checkboxes__input" id="chkDigest" type="checkbox">
          <label class="nhsuk-label nhsuk-checkboxes__label" for="chkDigest">
            Daily summary (pending verifications and unread messages)
          </label>
        </div>
      </div>
      <div class="nhsuk-form-group">
        <div class="nhsuk-checkboxes__item">
          <input class="nhsuk-checkboxes__input" id="chkInstant" type="checkbox">
          <label class="nhsuk-label nhsuk-checkboxes__label" for="chkInstant">
            Instant email when a clinician shares training for verification
          </label>
        </div>
      </div>

      <button type="button" class="nhsuk-button" id="btnSavePrefs">Save preferences</button>
      <p id="prefStatus" class="hr-muted" aria-live="polite"></p>
    </div>
  </main>
  <script src="/static/shared/auth.js?v=20260523-1"></script>
  <script src="/static/shared/nav-account.js?v=20260529-4"></script>
  <script>
    (function () {
      function apiJson(url, opts) {
        opts = opts || {};
        opts.credentials = 'same-origin';
        opts.headers = opts.headers || {};
        if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(opts.body);
        }
        return fetch(url, opts).then(function (r) {
          return r.json().then(function (j) {
            if (!r.ok) throw new Error((j && j.detail) || r.statusText);
            return j;
          });
        });
      }

      (async function () {
        await NHSAuth.refresh();
        if (!NHSAuth.user) {
          NHSAuth.requireAuth();
          return;
        }
        if (!NHSAuth.user.premium) {
          document.getElementById('notPremium').hidden = false;
          return;
        }
        if (window.NHSNavAccount) void NHSNavAccount.refresh();
        document.getElementById('prefsView').hidden = false;
        try {
          var data = await apiJson('/api/hr/email-preferences');
          document.getElementById('prefEmail').textContent = data.email || '—';
          document.getElementById('chkDigest').checked = !!data.digest_enabled;
          document.getElementById('chkInstant').checked = !!data.instant_enabled;
          var s = data.inbox_summary || {};
          var snap = 'Right now: ' + (s.pending_items || 0) + ' pending verification(s), ' +
            (s.unread_messages || 0) + ' unread message(s).';
          document.getElementById('inboxSnapshot').textContent = snap;
        } catch (e) {
          document.getElementById('prefStatus').textContent = e.message || 'Could not load preferences.';
        }
      })();

      document.getElementById('btnSavePrefs').addEventListener('click', function () {
        var status = document.getElementById('prefStatus');
        status.textContent = 'Saving…';
        apiJson('/api/hr/email-preferences', {
          method: 'PUT',
          body: {
            digest_enabled: document.getElementById('chkDigest').checked,
            instant_enabled: document.getElementById('chkInstant').checked
          }
        }).then(function () {
          status.textContent = 'Preferences saved.';
        }).catch(function (e) {
          status.textContent = e.message || 'Save failed.';
        });
      });
    })();
  </script>
</body>
</html>
