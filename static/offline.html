<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005eb8">
  <title>Offline — DocPass</title>
  <style>
    body {
      font-family: "Frutiger", "Source Sans Pro", Arial, sans-serif;
      background: #f0f4f5;
      color: #212b32;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .panel {
      background: #fff;
      border: 1px solid #d8dde0;
      border-left: 4px solid #005eb8;
      border-radius: 4px;
      padding: 1.5rem;
      max-width: 22rem;
      box-shadow: 0 2px 8px rgba(33, 43, 50, 0.07);
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
    p { margin: 0 0 1rem; line-height: 1.5; color: #4c6272; }
    a {
      color: #005eb8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>You are offline</h1>
    <p>DocPass needs an internet connection to sign in, sync your training wallet, and verify records.</p>
    <p><a href="/static/dashboard/">Try again</a></p>
  </div>
</body>
</html>
