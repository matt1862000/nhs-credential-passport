<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="DocPass">
  <meta name="theme-color" content="#005eb8">

  <title>Forgot password &mdash; DocPass</title>
  <link rel="stylesheet" href="/static/shared/app.css?v=20260521-2">
  <style>
    .auth-card { max-width: 28rem; }
    .auth-card .nhsuk-hint { display: block; font-size: 0.875rem; color: var(--nhsuk-secondary-text); margin-top: 0.35rem; line-height: 1.45; }
    .auth-success {
      margin: 0.5rem 0 0 0;
      padding: 0.85rem 1rem;
      background: #f0f7eb;
      border: 1px solid #c5d8b7;
      border-left: 4px solid #007f3b;
      border-radius: 4px;
      font-size: 0.9375rem;
    }
  </style>
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo nhsuk-header__service-logo--docpass" href="/" aria-label="DocPass home">
          <img class="docpass-header-logo" src="/static/shared/docpass-logo.png?v=20260519-1" alt="DocPass &mdash; professional credential wallet" width="420" height="146">
        </a>
      </div>
      <nav class="nhsuk-topnav" aria-label="Top">
        <a href="/static/auth/">Back to sign in</a>
      </nav>
    </div>
  </header>

  <main class="nhsuk-main" id="maincontent" role="main">
    <h1 class="nhsuk-page-heading">Forgot your password?</h1>
    <p class="nhsuk-lead">Enter the personal email you use to sign in to DocPass. If we recognise it, we&rsquo;ll email you a link to choose a new password.</p>

    <section class="nhsuk-card auth-card" id="forgotCard">
      <form id="formForgot" novalidate>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="forgotEmail">Personal email</label>
          <input class="nhsuk-input" type="email" id="forgotEmail" name="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="nhsuk-button">Send reset link</button>
      </form>
      <p class="nhsuk-error-msg" id="forgotError" hidden role="alert"></p>
      <div class="auth-success" id="forgotSuccess" hidden role="status" aria-live="polite"></div>
      <p style="margin:1rem 0 0 0; font-size:0.9375rem;">
        <a href="/static/auth/">Back to sign in</a>
      </p>
    </section>
  </main>

  <script>
    (function () {
      function showErr(msg) {
        var el = document.getElementById('forgotError');
        if (!el) return;
        el.textContent = msg || '';
        el.hidden = !msg;
      }
      function showOk(msg) {
        var el = document.getElementById('forgotSuccess');
        if (!el) return;
        el.textContent = msg || '';
        el.hidden = !msg;
      }
      function setBusy(busy) {
        var form = document.getElementById('formForgot');
        var btn = form.querySelector('button[type="submit"]');
        if (!btn) return;
        if (busy) {
          if (btn.dataset.defaultSubmitLabel === undefined) btn.dataset.defaultSubmitLabel = btn.textContent;
          btn.disabled = true;
          btn.setAttribute('aria-busy', 'true');
          btn.textContent = 'Sending\u2026';
        } else {
          btn.disabled = false;
          btn.removeAttribute('aria-busy');
          if (btn.dataset.defaultSubmitLabel !== undefined) btn.textContent = btn.dataset.defaultSubmitLabel;
        }
      }

      document.getElementById('formForgot').addEventListener('submit', async function (e) {
        e.preventDefault();
        showErr('');
        showOk('');
        var email = (document.getElementById('forgotEmail').value || '').trim();
        if (!email) {
          showErr('Enter your personal email.');
          return;
        }
        setBusy(true);
        try {
          var res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email }),
          });
          var data = null;
          try { data = await res.json(); } catch (e2) { data = null; }
          if (!res.ok) {
            var d = data && data.detail;
            throw new Error(typeof d === 'string' ? d : 'Could not send reset link');
          }
          var msg = (data && data.message)
            || "If that account exists, we've sent reset instructions to its email. The link is valid for 15 minutes.";
          showOk(msg);
          document.getElementById('forgotEmail').value = '';
        } catch (err) {
          showErr(err.message || 'Could not send reset link');
        } finally {
          setBusy(false);
        }
      });
    })();
  </script>
</body>
</html>
