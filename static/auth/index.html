<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in &mdash; NHS Training Passport</title>
  <link rel="stylesheet" href="/static/shared/app.css">
  <style>
    .auth-toggle { display: inline-flex; gap: 0; border: 2px solid var(--nhsuk-border); border-radius: 4px; overflow: hidden; margin-bottom: 1.25rem; }
    .auth-toggle button {
      background: #fff; border: none; padding: 0.55rem 1rem; font-family: inherit;
      font-size: 1rem; font-weight: 600; color: var(--nhsuk-link); cursor: pointer;
    }
    .auth-toggle button[aria-selected="true"] { background: var(--nhsuk-link); color: #fff; }
    .auth-toggle button:focus { outline: 3px solid var(--nhsuk-focus); outline-offset: 2px; }
    .auth-card { max-width: 28rem; }
    .auth-card .nhsuk-hint { display: block; font-size: 0.875rem; color: var(--nhsuk-secondary-text); margin-top: 0.35rem; }
  </style>
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo" href="/" aria-label="NHS Training Passport homepage">
          <svg class="nhsuk-header__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" focusable="false" role="img" aria-label="NHS">
            <path fill="currentColor" d="M200 0v80H0V0h200Zm-27.5 5.5c-14.5 0-29 5-29 22 0 10.2 7.7 13.5 14.7 16.3l.7.3c5.4 2 10.1 3.9 10.1 8.4 0 6.5-8.5 7.5-14 7.5s-12.5-1.5-16-3.5L135 70c5.5 2 13.5 3.5 20 3.5 15.5 0 32-4.5 32-22.5 0-19.5-25.5-16.5-25.5-25.5 0-5.5 5.5-6.5 12.5-6.5a35 35 0 0 1 14.5 3l4-13.5c-4.5-2-12-3-20-3Zm-131 2h-22l-14 65H22l9-45h.5l13.5 45h21.5l14-65H64l-9 45h-.5l-13-45Zm63 0h-18l-13 65h17l6-28H117l-5.5 28H129l13.5-65H125L119.5 32h-20l5-24.5Z" />
          </svg>
          <span class="nhsuk-header__service-name">Training Passport</span>
        </a>
      </div>
      <nav class="nhsuk-topnav" aria-label="Top">
        <a href="/">Back to start</a>
      </nav>
    </div>
  </header>

  <main class="nhsuk-main" id="maincontent" role="main">
    <h1 class="nhsuk-page-heading" id="authPageTitle">Sign in</h1>
    <p class="nhsuk-lead" id="authPageLead">Use the same account on any device to keep your training list in sync.</p>

    <div class="auth-toggle" role="tablist" aria-label="Choose sign in or create account">
      <button type="button" id="tabSignIn" role="tab" aria-selected="true">Sign in</button>
      <button type="button" id="tabRegister" role="tab" aria-selected="false">Create account</button>
    </div>

    <section class="nhsuk-card auth-card" id="signInCard">
      <h2>Sign in</h2>
      <form id="formSignIn" novalidate>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="loginEmail">Email address</label>
          <input class="nhsuk-input" type="email" id="loginEmail" name="email" autocomplete="email" required placeholder="you@nhs.net">
        </div>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="loginPassword">Password</label>
          <input class="nhsuk-input" type="password" id="loginPassword" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="nhsuk-button">Sign in</button>
      </form>
      <p class="nhsuk-error-msg" id="signInError" hidden role="alert"></p>
    </section>

    <section class="nhsuk-card auth-card" id="registerCard" hidden>
      <h2>Create account</h2>
      <form id="formRegister" novalidate>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="regEmail">Email address</label>
          <input class="nhsuk-input" type="email" id="regEmail" name="email" autocomplete="email" required placeholder="you@nhs.net">
        </div>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="regPassword">Password (8+ characters)</label>
          <input class="nhsuk-input" type="password" id="regPassword" name="password" autocomplete="new-password" required minlength="8">
        </div>
        <button type="submit" class="nhsuk-button">Create account</button>
      </form>
      <p class="nhsuk-error-msg" id="registerError" hidden role="alert"></p>
    </section>
  </main>

  <script src="/static/wallet/wallet-store.js"></script>
  <script src="/static/shared/auth.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var initialMode = p.get('mode') === 'register' ? 'register' : 'signin';
      var tabSI = document.getElementById('tabSignIn');
      var tabReg = document.getElementById('tabRegister');
      var cardSI = document.getElementById('signInCard');
      var cardReg = document.getElementById('registerCard');
      var lead = document.getElementById('authPageLead');
      var title = document.getElementById('authPageTitle');

      function show(mode) {
        var isReg = mode === 'register';
        tabSI.setAttribute('aria-selected', isReg ? 'false' : 'true');
        tabReg.setAttribute('aria-selected', isReg ? 'true' : 'false');
        cardSI.hidden = isReg;
        cardReg.hidden = !isReg;
        title.textContent = isReg ? 'Create account' : 'Sign in';
        lead.textContent = isReg
          ? 'Use your email and choose a password to start.'
          : 'Use the same account on any device to keep your training list in sync.';
        var url = new URL(window.location.href);
        url.searchParams.set('mode', isReg ? 'register' : 'signin');
        window.history.replaceState({}, '', url.toString());
      }
      tabSI.addEventListener('click', function () { show('signin'); });
      tabReg.addEventListener('click', function () { show('register'); });
      show(initialMode);

      function showErr(id, msg) {
        var el = document.getElementById(id);
        if (!el) return;
        if (msg) {
          el.textContent = msg;
          el.hidden = false;
        } else {
          el.textContent = '';
          el.hidden = true;
        }
      }

      document.getElementById('formSignIn').addEventListener('submit', async function (e) {
        e.preventDefault();
        showErr('signInError', '');
        var fd = new FormData(this);
        try {
          await NHSAuth.signIn((fd.get('email') || '').trim(), fd.get('password') || '');
          if (window.NHSWallet && typeof NHSWallet.resetDeviceWalletCache === 'function') {
            await NHSWallet.resetDeviceWalletCache();
          }
          await NHSAuth.pullWalletMerge();
          if (!NHSAuth.user.premium && !NHSAuth.isProfileComplete()) {
            NHSAuth.redirectAfterAuth('/static/profile/?required=1');
          } else {
            NHSAuth.redirectAfterAuth('/static/dashboard/');
          }
        } catch (err) {
          showErr('signInError', err.message || 'Could not sign in');
        }
      });

      document.getElementById('formRegister').addEventListener('submit', async function (e) {
        e.preventDefault();
        showErr('registerError', '');
        var fd = new FormData(this);
        try {
          await NHSAuth.register((fd.get('email') || '').trim(), fd.get('password') || '');
          /* Do not merge an old browser list into a brand-new account (shared device / prior anonymous use). */
          if (window.NHSWallet && typeof NHSWallet.resetDeviceWalletCache === 'function') {
            await NHSWallet.resetDeviceWalletCache();
          }
          await NHSAuth.pullWalletMerge();
          NHSAuth.redirectAfterAuth('/static/profile/?welcome=1');
        } catch (err) {
          showErr('registerError', err.message || 'Could not create account');
        }
      });

      /* If already signed in, skip auth page. */
      (async function () {
        await NHSAuth.refresh();
        if (!NHSAuth.user) return;
        if (!NHSAuth.user.premium && !NHSAuth.isProfileComplete()) {
          window.location.replace('/static/profile/?required=1');
          return;
        }
        NHSAuth.redirectAfterAuth('/static/dashboard/');
      })();
    })();
  </script>
</body>
</html>
