<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="DocPass">
  <meta name="theme-color" content="#005eb8">

  <title>Sign in &mdash; DocPass</title>
  <link rel="stylesheet" href="/static/shared/app.css?v=20260519-1">
  <style>
    .auth-card { max-width: 28rem; }
    .auth-card .nhsuk-hint { display: block; font-size: 0.875rem; color: var(--nhsuk-secondary-text); margin-top: 0.35rem; line-height: 1.45; }
  </style>
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo nhsuk-header__service-logo--docpass" href="/" aria-label="DocPass home">
          <img class="docpass-header-logo" src="/static/shared/docpass-logo.png?v=20260519-1" alt="DocPass — professional credential wallet" width="420" height="146">
        </a>
      </div>
      <nav class="nhsuk-topnav" aria-label="Top">
        <a href="/">Back to start</a>
      </nav>
    </div>
  </header>

  <main class="nhsuk-main" id="maincontent" role="main">
    <h1 class="nhsuk-page-heading">Sign in</h1>
    <p class="nhsuk-lead">Your HR team creates your DocPass account. Sign in with your <strong>NHS work email</strong> and the password sent to your personal email.</p>

    <section class="nhsuk-card auth-card" id="signInCard">
      <h2>Sign in</h2>
      <form id="formSignIn" novalidate>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="loginEmail">NHS work email</label>
          <input class="nhsuk-input" type="email" id="loginEmail" name="email" autocomplete="email" required placeholder="firstname.surname123@nhs.net">
        </div>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="loginPassword">Password</label>
          <input class="nhsuk-input" type="password" id="loginPassword" name="password" autocomplete="current-password" required>
          <span class="nhsuk-hint">Use the password HR sent to your personal email. You will be asked to change it on first sign-in.</span>
        </div>
        <button type="submit" class="nhsuk-button">Sign in</button>
      </form>
      <p class="nhsuk-error-msg" id="signInError" hidden role="alert"></p>
    </section>
  </main>

  <script src="/static/wallet/wallet-store.js"></script>
  <script src="/static/shared/auth.js"></script>
  <script>
    (function () {
      function showErr(id, msg) {
        var el = document.getElementById(id);
        if (!el) return;
        if (msg) {
          el.textContent = msg;
          el.hidden = false;
        } else {
          el.textContent = '';
          el.hidden = true;
        }
      }

      function setSubmitBusy(formId, busy, busyLabel) {
        var form = document.getElementById(formId);
        if (!form) return;
        var btn = form.querySelector('button[type="submit"]');
        if (!btn) return;
        if (busy) {
          if (btn.dataset.defaultSubmitLabel === undefined) btn.dataset.defaultSubmitLabel = btn.textContent;
          btn.disabled = true;
          btn.classList.add('is-loading');
          btn.setAttribute('aria-busy', 'true');
          btn.textContent = busyLabel || 'Working…';
        } else {
          btn.disabled = false;
          btn.classList.remove('is-loading');
          btn.removeAttribute('aria-busy');
          if (btn.dataset.defaultSubmitLabel !== undefined) {
            btn.textContent = btn.dataset.defaultSubmitLabel;
          }
        }
      }

      document.getElementById('formSignIn').addEventListener('submit', async function (e) {
        e.preventDefault();
        showErr('signInError', '');
        setSubmitBusy('formSignIn', true, 'Signing in…');
        var fd = new FormData(this);
        try {
          await NHSAuth.signIn((fd.get('email') || '').trim(), fd.get('password') || '');
          if (window.NHSWallet && typeof NHSWallet.resetDeviceWalletCache === 'function') {
            await NHSWallet.resetDeviceWalletCache();
          }
          await NHSAuth.pullWalletMerge();
          NHSAuth.redirectPostLogin('/static/dashboard/');
        } catch (err) {
          showErr('signInError', err.message || 'Could not sign in');
          setSubmitBusy('formSignIn', false);
        }
      });

      (async function () {
        await NHSAuth.refresh();
        if (!NHSAuth.user) return;
        window.location.replace(NHSAuth.postLoginPath('/static/dashboard/'));
      })();
    })();
  </script>
</body>
</html>
