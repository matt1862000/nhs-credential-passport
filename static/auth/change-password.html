<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="DocPass">
  <meta name="theme-color" content="#005eb8">
  <title>Change password &mdash; DocPass</title>
  <link rel="stylesheet" href="/static/shared/app.css?v=20260521-2">
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo nhsuk-header__service-logo--docpass" href="/static/dashboard/" aria-label="Dashboard">
          <img class="docpass-header-logo" src="/static/shared/docpass-logo.png?v=20260519-1" alt="DocPass — professional credential wallet" width="420" height="146">
        </a>
      </div>
      <nav class="nhsuk-topnav" aria-label="Account">
        <div class="nhsuk-topnav__account" id="navAccount">
          <span class="nhsuk-topnav__name" id="navUserName">&nbsp;</span>
          <a href="/static/messages/" class="nhsuk-topnav__messages" id="navMessagesLink" aria-label="Messages">
            <svg class="nhsuk-topnav__envelope" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span class="nhsuk-topnav__msg-badge" id="navMsgBadge" hidden aria-live="polite"></span>
          </a>
        </div>
        <div class="nhsuk-menu">
          <button type="button" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel">Menu</button>
          <div class="nhsuk-menu__panel" id="menuPanel" role="menu" hidden>
            <a href="/static/dashboard/" role="menuitem">Dashboard</a>
            <a href="/static/profile/" role="menuitem">Profile</a>
            <button type="button" id="btnSignOut" role="menuitem">Sign out</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="nhsuk-main" id="maincontent" role="main">
    <h1 class="nhsuk-page-heading">Change your password</h1>
    <p class="nhsuk-lead">Your trust created this account. Choose a new password before continuing (at least 8 characters).</p>

    <section class="nhsuk-card" style="max-width: 28rem;">
      <form id="formChangePassword" novalidate>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="currentPassword">Current password</label>
          <input class="nhsuk-input" type="password" id="currentPassword" name="current_password" autocomplete="current-password" required>
          <span class="nhsuk-hint" style="display:block;margin-top:0.35rem;">Use the password HR sent you.</span>
        </div>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="newPassword">New password</label>
          <input class="nhsuk-input" type="password" id="newPassword" name="new_password" autocomplete="new-password" required minlength="8">
        </div>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="confirmPassword">Confirm new password</label>
          <input class="nhsuk-input" type="password" id="confirmPassword" autocomplete="new-password" required minlength="8">
        </div>
        <button type="submit" class="nhsuk-button">Save and continue</button>
      </form>
      <p class="nhsuk-error-msg" id="changePwError" hidden role="alert"></p>
    </section>
  </main>

  <script src="/static/shared/auth.js"></script>
  <script src="/static/shared/nav-account.js?v=20260522-1"></script>
  <script src="/static/shared/app-menu.js?v=20260522-1"></script>
  <script>
    (function () {
      function showErr(msg) {
        var el = document.getElementById('changePwError');
        if (!el) return;
        el.textContent = msg || '';
        el.hidden = !msg;
      }

      document.getElementById('formChangePassword').addEventListener('submit', async function (e) {
        e.preventDefault();
        showErr('');
        var fd = new FormData(this);
        var cur = fd.get('current_password') || '';
        var neu = fd.get('new_password') || '';
        var conf = document.getElementById('confirmPassword').value || '';
        if (neu !== conf) {
          showErr('New passwords do not match.');
          return;
        }
        var btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
          await NHSAuth.changePassword(cur, neu);
          window.location.replace(NHSAuth.postLoginPath('/static/dashboard/'));
        } catch (err) {
          showErr(err.message || 'Could not change password');
          btn.disabled = false;
        }
      });

      (async function () {
        await NHSAuth.refresh();
        if (window.NHSNavAccount) void NHSNavAccount.refresh();
        if (!NHSAuth.requireAuth()) return;
        if (NHSAuth.user.premium) {
          window.location.replace('/static/dashboard/');
          return;
        }
        if (!NHSAuth.mustChangePassword()) {
          window.location.replace(NHSAuth.postLoginPath('/static/dashboard/'));
        }
      })();
    })();
  </script>
</body>
</html>
