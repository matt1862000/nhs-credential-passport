<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="DocPass">
  <meta name="theme-color" content="#005eb8">
  <title>Complete your profile &mdash; DocPass</title>
  <link rel="stylesheet" href="/static/shared/app.css?v=20260521-2">
  <style>
    .profile-ac-wrap { position: relative; }
    .profile-suggest-list {
      position: absolute; left: 0; right: 0; top: 100%; margin: 0.15rem 0 0 0;
      padding: 0; list-style: none; max-height: 14rem; overflow-y: auto;
      z-index: 40; background: #fff; border: 1px solid var(--nhsuk-border);
      border-radius: 4px; box-shadow: 0 4px 14px rgba(33, 43, 50, 0.12);
    }
    .profile-suggest-list li {
      padding: 0.5rem 0.75rem; cursor: pointer; font-size: 1rem; line-height: 1.35;
      border-bottom: 1px solid var(--nhsuk-border);
    }
    .profile-suggest-list li:last-child { border-bottom: none; }
    .profile-suggest-list li:hover,
    .profile-suggest-list li[aria-selected="true"] { background: var(--nhsuk-panel); }
    .trust-suggest-meta { display: block; font-size: 0.8125rem; color: var(--nhsuk-secondary-text); margin-top: 0.2rem; }
  </style>
</head>
<body>
  <header class="nhsuk-header" role="banner">
    <div class="nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo nhsuk-header__service-logo--docpass" href="/static/dashboard/" aria-label="Dashboard">
          <img class="docpass-header-logo" src="/static/shared/docpass-logo.png?v=20260519-1" alt="DocPass — professional credential wallet" width="420" height="146">
        </a>
      </div>
      <nav class="nhsuk-topnav" aria-label="Account">
        <div class="nhsuk-topnav__account" id="navAccount">
          <span class="nhsuk-topnav__name" id="navUserName">&nbsp;</span>
          <a href="/static/messages/" class="nhsuk-topnav__messages" id="navMessagesLink" aria-label="Messages">
            <svg class="nhsuk-topnav__envelope" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span class="nhsuk-topnav__msg-badge" id="navMsgBadge" hidden aria-live="polite"></span>
          </a>
        </div>
        <div class="nhsuk-menu">
          <button type="button" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel">Menu</button>
          <div class="nhsuk-menu__panel" id="menuPanel" role="menu" hidden>
            <a href="/static/dashboard/" role="menuitem">Dashboard</a>
            <a href="/static/profile/" role="menuitem">Profile</a>
            <button type="button" id="btnSignOut" role="menuitem">Sign out</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="nhsuk-main" id="maincontent" role="main">
    <h1 class="nhsuk-page-heading">Complete your profile</h1>
    <p class="nhsuk-lead">Your trust set up DocPass for you. Add your details to finish.</p>

    <section class="nhsuk-card" style="max-width: 32rem;">
      <form id="formOnboarding" novalidate>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="displayName">Full name</label>
          <input class="nhsuk-input" type="text" id="displayName" required maxlength="200" autocomplete="name">
        </div>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="gmcNumber">GMC number</label>
          <input class="nhsuk-input" type="text" id="gmcNumber" required inputmode="numeric" maxlength="11" pattern="[0-9]{7}" title="Seven digits">
          <span class="nhsuk-hint" style="display:block;margin-top:0.35rem;">Seven digits.</span>
        </div>
        <div class="nhsuk-form-group">
          <label class="nhsuk-label" for="currentTrust">Current trust</label>
          <div class="profile-ac-wrap" id="trustAcWrap">
            <input class="nhsuk-input" type="text" id="currentTrust" required maxlength="200" autocomplete="off" placeholder="e.g. Sheffield Teaching Hospitals" role="combobox" aria-autocomplete="list" aria-controls="trustSuggestList" aria-expanded="false" spellcheck="false">
            <ul id="trustSuggestList" class="profile-suggest-list" role="listbox" hidden aria-label="Matching NHS trusts and health boards"></ul>
          </div>
          <span class="nhsuk-hint" style="display:block;margin-top:0.35rem;">Start typing a few letters. Suggestions use the NHS Organisation Directory; pick one or keep your own text.</span>
        </div>
        <button type="submit" class="nhsuk-button">Continue to dashboard</button>
      </form>
      <p class="nhsuk-error-msg" id="onboardError" hidden role="alert"></p>
    </section>
  </main>

  <script src="/static/shared/ods-trust-suggest.js"></script>
  <script src="/static/shared/trust-autocomplete.js"></script>
  <script src="/static/shared/auth.js?v=20260523-1"></script>
  <script src="/static/shared/nav-account.js?v=20260522-1"></script>
  <script src="/static/shared/app-menu.js?v=20260522-1"></script>
  <script>
    (function () {
      function showErr(msg) {
        var el = document.getElementById('onboardError');
        if (!el) return;
        el.textContent = msg || '';
        el.hidden = !msg;
      }

      function readOnboardingPayload() {
        var gmc = String(document.getElementById('gmcNumber').value || '').replace(/\D/g, '');
        if (!/^\d{7}$/.test(gmc)) return null;
        var name = document.getElementById('displayName').value.trim();
        var trust = document.getElementById('currentTrust').value.trim();
        if (!name || !trust) return null;
        return {
          display_name: name,
          gmc_number: gmc,
          current_trust: trust,
        };
      }

      async function saveOnboardingAndGoDashboard() {
        showErr('');
        var payload = readOnboardingPayload();
        if (!payload) {
          if (NHSAuth.isProfileComplete()) {
            await NHSAuth.syncOnboardingIfProfileComplete();
            window.location.replace('/static/dashboard/');
            return;
          }
          showErr('Complete your profile: full name, 7-digit GMC number, and current trust.');
          return;
        }
        await NHSAuth.updateProfile(payload);
        await NHSAuth.pullWalletMerge();
        window.location.replace('/static/dashboard/');
      }

      document.getElementById('formOnboarding').addEventListener('submit', async function (e) {
        e.preventDefault();
        var btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
          await saveOnboardingAndGoDashboard();
        } catch (err) {
          showErr(err.message || 'Could not save profile');
          btn.disabled = false;
        }
      });

      document.querySelectorAll('a[href="/static/dashboard/"]').forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          void saveOnboardingAndGoDashboard().catch(function (err) {
            showErr(err.message || 'Could not save profile');
          });
        });
      });

      (async function () {
        await NHSAuth.refresh();
        if (window.NHSNavAccount) void NHSNavAccount.refresh();
        if (!NHSAuth.requireAuth()) return;
        if (NHSAuth.user.premium) {
          window.location.replace('/static/dashboard/');
          return;
        }
        if (!NHSAuth.requirePasswordChanged()) return;
        if (NHSAuth.hasCompletedOnboarding()) {
          window.location.replace(NHSAuth.postLoginPath('/static/dashboard/'));
          return;
        }
        var u = NHSAuth.user;
        if (u.display_name) document.getElementById('displayName').value = u.display_name;
        if (u.gmc_number) document.getElementById('gmcNumber').value = u.gmc_number;
        if (u.current_trust) document.getElementById('currentTrust').value = u.current_trust_display || u.current_trust;
        if (window.NHSTrustAutocomplete) {
          NHSTrustAutocomplete.wire({
            inputId: 'currentTrust',
            listId: 'trustSuggestList',
            wrapId: 'trustAcWrap',
            metaClass: 'trust-suggest-meta',
          });
        }
      })();
    })();
  </script>
</body>
</html>
